<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="二上音视频">
<meta name="theme-color" content="#2563eb">
<title>新交际英语 二上 · 音视频播放器</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --line:#e4e8ef; --txt:#1e2532; --sub:#6b7280;
  --pri:#2563eb; --pri-soft:#eaf1ff; --pri-dark:#1d4ed8;
  --ok:#059669; --warn:#d97706; --now:#fff7e6;
  --shadow:0 1px 3px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.6;
  padding-bottom:calc(104px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{touch-action:manipulation}
button{font-family:inherit;font-size:14px;cursor:pointer}
.app{max-width:1440px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{padding:22px 0 14px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
h1{margin:0;font-size:23px;font-weight:700;letter-spacing:.3px}
h1 small{font-size:13px;font-weight:400;color:var(--sub);margin-left:10px;letter-spacing:0}
.tabs{display:flex;gap:6px;background:#e9edf4;padding:4px;border-radius:11px;margin-left:auto}
.tab{
  border:0;background:transparent;color:var(--sub);font-size:15px;font-weight:600;
  padding:8px 20px;border-radius:8px;transition:.15s;
}
.tab:hover{color:var(--txt)}
.tab.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.tab .cnt{font-size:12px;opacity:.75;margin-left:4px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:18px;align-items:start}
@media (max-width:1080px){
  .layout{grid-template-columns:1fr}
  .stage{order:-1}                 /* 手机上播放器排到列表上方 */
  .listbox{max-height:none}
  .queue{max-height:240px}
  .toolbar .hint{display:none}
}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* ---------- toolbar ---------- */
.toolbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;
  background:var(--card);border-radius:14px 14px 0 0;z-index:5;
}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--txt);
  padding:7px 13px;border-radius:9px;font-weight:500;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:#c3ccdb;background:#f8fafc}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-dark);border-color:var(--pri-dark)}
.btn.sm{padding:4px 9px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{color:var(--sub);font-size:13px;margin-left:auto}

/* ---------- list ---------- */
.listbox{max-height:calc(100vh - 240px);overflow:auto;padding:6px 0 10px}
.group{padding:4px 0}
.ghead{
  display:flex;align-items:center;gap:10px;padding:9px 16px 5px;
  font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.4px;
}
.ghead .line{flex:1;height:1px;background:var(--line)}
.item{
  display:flex;align-items:center;gap:11px;padding:9px 16px;cursor:pointer;
  border-left:3px solid transparent;transition:.12s;
}
.item:hover{background:#f7f9fc}
.item.playing{background:var(--now);border-left-color:var(--warn)}
.item .cb{width:16px;height:16px;accent-color:var(--pri);cursor:pointer;flex:none}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.item.playing .nm{font-weight:600}
.item .ic{opacity:0;color:var(--pri);font-size:13px;flex:none}
.item:hover .ic{opacity:.6}
.item.playing .ic{opacity:1}
.item .badge{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:0 5px;flex:none}
.empty{padding:34px 16px;text-align:center;color:var(--sub);font-size:14px}

/* ---------- stage ---------- */
.stage{padding:14px;display:flex;flex-direction:column;gap:12px}
.video-wrap{position:relative;background:#0b1220;border-radius:11px;overflow:hidden;aspect-ratio:16/9}
video{width:100%;height:100%;display:block;object-fit:contain;background:#0b1220}
.vph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#7c8aa0;font-size:14px;letter-spacing:.5px}
.now{
  border:1px solid var(--line);border-radius:11px;padding:13px 14px;background:#fbfcfe;
  display:flex;align-items:center;gap:12px;
}
.now .eq{width:34px;height:34px;border-radius:50%;background:var(--pri-soft);color:var(--pri);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.now .t{min-width:0;flex:1}
.now .t b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now .t span{font-size:12.5px;color:var(--sub)}
.qhead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--sub);padding:2px 2px 0}
.qhead .n{margin-left:auto;font-weight:500}
.queue{max-height:330px;overflow:auto;border:1px solid var(--line);border-radius:11px}
.qitem{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #f1f4f9;font-size:14px}
.qitem:last-child{border-bottom:0}
.qitem.cur{background:var(--now)}
.qitem .i{width:20px;color:var(--sub);font-size:12px;text-align:right;flex:none}
.qitem .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.qitem.cur .n{font-weight:600;color:var(--warn)}
.qitem .x{border:0;background:transparent;color:#c0c7d4;padding:0 4px;font-size:15px;line-height:1}
.qitem .x:hover{color:#ef4444}
.opts{display:flex;gap:14px;flex-wrap:wrap;padding:2px}
.opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.opt select,.opt input[type=number]{
  border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:13px;background:#fff;color:var(--txt);
}

/* ---------- bottom bar ---------- */
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:#fff;border-top:1px solid var(--line);
  box-shadow:0 -2px 14px rgba(16,24,40,.06);
}
.bar-in{max-width:1440px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar{padding-bottom:env(safe-area-inset-bottom)}
.ctl{display:flex;align-items:center;gap:6px}
.rbtn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;
  font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--txt);transition:.15s;
}
.rbtn:hover{background:#f3f6fb;border-color:#c3ccdb}
.rbtn.main{width:44px;height:44px;background:var(--pri);border-color:var(--pri);color:#fff;font-size:17px}
.rbtn.main:hover{background:var(--pri-dark)}
.bar .title{min-width:150px;max-width:280px}
.bar .title b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .title span{font-size:12px;color:var(--sub)}
.seek{flex:1;min-width:180px;display:flex;align-items:center;gap:9px}
.seek input[type=range]{flex:1;accent-color:var(--pri);height:4px;cursor:pointer}
.tm{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--txt);font-size:13px}
.vol{display:flex;align-items:center;gap:7px}
.vol input[type=range]{width:88px;accent-color:var(--pri);cursor:pointer}
.modebtn{min-width:82px;font-size:13px;padding:7px 10px}
.kbd{font-size:11.5px;color:#9aa3b2;border-left:1px solid var(--line);padding-left:12px;line-height:1.5}
@media (max-width:820px){.kbd{display:none}.bar .title{display:none}}
@media (max-width:640px){
  .app{padding:0 12px}
  h1{font-size:18px;width:100%}
  h1 small{display:block;margin:3px 0 0;font-size:12px}
  .tabs{width:100%;margin:10px 0 0}
  .tab{flex:1;text-align:center;padding:9px 8px}
  header{padding:16px 0 10px;gap:0}
  .bar-in{gap:10px;padding:9px 12px}
  .seek{order:3;min-width:100%;flex-basis:100%}
  .bar .title{order:4;max-width:none;flex:1}
  .item{padding:11px 12px}
  .toolbar{padding:10px}
  .rbtn{width:40px;height:40px}
  .rbtn.main{width:46px;height:46px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>新交际英语 二年级上册 · 音视频播放台<small>课文动画 / 课文与单词音频</small></h1>
    <div class="tabs">
      <button class="tab on" data-tab="audio">🎧 音频<span class="cnt" id="cntA">0</span></button>
      <button class="tab" data-tab="video">🎬 视频<span class="cnt" id="cntV">0</span></button>
    </div>
  </header>

  <div class="layout">
    <!-- 左：资源列表 -->
    <section class="panel">
      <div class="toolbar">
        <button class="btn" id="btnSelAll">全选</button>
        <button class="btn" id="btnSelNone">清空选择</button>
        <button class="btn pri" id="btnPlaySel" disabled>▶ 播放选中（0）</button>
        <button class="btn" id="btnPlayAll">▶ 连播全部</button>
        <span class="hint">点击即可播放，自动连播下去；勾选可自建播放列表</span>
      </div>
      <div class="listbox" id="list"></div>
    </section>

    <!-- 右：舞台 + 队列 -->
    <section class="panel stage">
      <div class="video-wrap" id="vwrap" style="display:none">
        <video id="vdo" playsinline preload="metadata"></video>
        <div class="vph" id="vph">从左侧列表选择一个视频开始播放</div>
      </div>
      <div class="now" id="now">
        <div class="eq" id="nowIc">🎧</div>
        <div class="t">
          <b id="nowName">尚未播放</b>
          <span id="nowSub">从左侧列表选择一个音频开始</span>
        </div>
        <button class="btn sm" id="btnFull" style="display:none">⛶ 全屏</button>
      </div>

      <div class="qhead">连播列表 <span class="n" id="qCount">0 项</span>
        <button class="btn sm" id="btnQClear">清空</button>
      </div>
      <div class="queue" id="queue"></div>

      <div class="opts">
        <label class="opt">播放模式
          <select id="mode">
            <option value="loop">列表循环</option>
            <option value="order">顺序播放</option>
            <option value="single">单曲循环</option>
          </select>
        </label>
        <label class="opt">跟读间隔
          <select id="gap">
            <option value="0">不间隔</option>
            <option value="2">2 秒</option>
            <option value="3">3 秒</option>
            <option value="5">5 秒</option>
            <option value="10">10 秒</option>
          </select>
        </label>
        <label class="opt">倍速
          <select id="rate">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1.0×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2.0×</option>
          </select>
        </label>
      </div>
    </section>
  </div>
</div>

<!-- 底部控制条 -->
<div class="bar">
  <div class="bar-in">
    <div class="ctl">
      <button class="rbtn" id="bPrev" title="上一个 (P)">⏮</button>
      <button class="rbtn main" id="bPlay" title="播放/暂停 (空格)">▶</button>
      <button class="rbtn" id="bNext" title="下一个 (N)">⏭</button>
      <button class="rbtn" id="bBack" title="后退 5 秒 (←)">↺</button>
    </div>
    <div class="title"><b id="barName">—</b><span id="barState">就绪</span></div>
    <div class="seek">
      <span class="tm" id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" step="1">
      <span class="tm" id="tDur">0:00</span>
    </div>
    <div class="vol">🔊<input type="range" id="vol" min="0" max="1" step="0.01" value="1"></div>
    <button class="btn modebtn" id="bMode">列表循环</button>
    <div class="kbd">空格 播放/暂停　← → 快退快进 5s<br>P / N 上一个 / 下一个</div>
  </div>
</div>

<audio id="ado" preload="metadata"></audio>

<script>
const DATA = /*__DATA__*/null;
const LS = 'xyj2a_player_v1';

/* ---------- state ---------- */
const S = {
  tab: 'audio',
  queue: [],
  idx: -1,
  mode: 'loop',
  sel: new Set(),
  gap: 0,
  seeking: false,
  gapTimer: null,
};
const $ = id => document.getElementById(id);
const ado = $('ado'), vdo = $('vdo');
const media = () => (S.tab === 'audio' ? ado : vdo);
const key = (t, p) => t + '|' + p;
const flat = t => (DATA[t] || []).map(it => ({ ...it, k: key(t, it.path), t }));
const fmt = s => {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60), x = Math.floor(s % 60);
  return m + ':' + String(x).padStart(2, '0');
};
/* 线上分享链接带 sharecode，媒体请求必须原样带上，否则 403 */
const QS = location.search || '';
const url = p => encodeURI(p) + QS;

/* ---------- 渲染列表 ---------- */
function renderList() {
  const items = flat(S.tab);
  const box = $('list');
  if (!items.length) { box.innerHTML = '<div class="empty">该分类下没有找到媒体文件</div>'; return; }
  const groups = [];
  items.forEach(it => {
    let g = groups.find(x => x.n === it.g);
    if (!g) { g = { n: it.g, list: [] }; groups.push(g); }
    g.list.push(it);
  });
  let html = '';
  groups.forEach(g => {
    html += '<div class="group"><div class="ghead">'
      + '<button class="btn sm" data-g="' + encodeURIComponent(g.n) + '">▶ 连播本组</button>'
      + '<span>' + esc(g.n) + '</span><span class="line"></span>'
      + '<span style="font-weight:500">' + g.list.length + '</span></div>';
    g.list.forEach(it => {
      const on = S.sel.has(it.k) ? ' checked' : '';
      html += '<div class="item" data-k="' + encodeURIComponent(it.k) + '">'
        + '<input class="cb" type="checkbox"' + on + ' data-cb="' + encodeURIComponent(it.k) + '">'
        + '<span class="nm">' + esc(it.name) + '</span>'
        + '<span class="badge">' + (it.t === 'audio' ? 'MP3' : 'MP4') + '</span>'
        + '<span class="ic">▶</span></div>';
    });
    html += '</div>';
  });
  box.innerHTML = html;
  markPlaying();
  $('cntA').textContent = (DATA.audio || []).length;
  $('cntV').textContent = (DATA.video || []).length;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function markPlaying() {
  const cur = S.queue[S.idx];
  document.querySelectorAll('.item').forEach(el => {
    const k = decodeURIComponent(el.dataset.k);
    el.classList.toggle('playing', !!cur && cur.k === k);
  });
  const el = document.querySelector('.item.playing');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

/* ---------- 队列 ---------- */
function setQueue(list, startKey) {
  S.queue = list.slice();
  S.idx = startKey ? S.queue.findIndex(x => x.k === startKey) : 0;
  if (S.idx < 0) S.idx = 0;
  renderQueue();
  load(S.idx, true);
}
function renderQueue() {
  const q = $('queue');
  $('qCount').textContent = S.queue.length + ' 项';
  if (!S.queue.length) { q.innerHTML = '<div class="empty">列表为空 · 点击左侧条目自动连播</div>'; return; }
  q.innerHTML = S.queue.map((it, i) =>
    '<div class="qitem' + (i === S.idx ? ' cur' : '') + '">'
    + '<span class="i">' + (i + 1) + '</span>'
    + '<span class="n" data-jump="' + i + '">' + esc(it.name) + '</span>'
    + '<button class="x" data-del="' + i + '" title="移出列表">✕</button></div>').join('');
}

/* ---------- 播放 ---------- */
function stopGap() { if (S.gapTimer) { clearTimeout(S.gapTimer); S.gapTimer = null; } }

function load(i, autoplay) {
  stopGap();
  if (i < 0 || i >= S.queue.length) return;
  S.idx = i;
  const it = S.queue[i];
  if (it.t !== S.tab) switchTab(it.t, true);
  const m = media();
  m.src = url(it.path);
  m.playbackRate = parseFloat($('rate').value);
  m.load();
  $('nowName').textContent = it.name;
  $('nowSub').textContent = (it.t === 'audio' ? '音频' : '视频') + ' · ' + it.g
    + ' · 第 ' + (i + 1) + ' / ' + S.queue.length + ' 项';
  $('barName').textContent = it.name;
  $('nowIc').textContent = it.t === 'audio' ? '🎧' : '🎬';
  $('vwrap').style.display = it.t === 'video' ? '' : 'none';
  $('vph').style.display = 'none';
  $('btnFull').style.display = it.t === 'video' ? '' : 'none';
  if (it.t === 'video') $('vwrap').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  markPlaying(); renderQueue();
  save({ last: { k: it.k, t: 0 } });
  if (autoplay) m.play().catch(() => { $('barState').textContent = '点按播放继续'; tapToPlay(it.t); });
}

/* iOS / iPadOS 有时拒绝非手势触发的自动播放，给一个显式的点击入口 */
function tapToPlay(t) {
  const ph = $('vph');
  if (t !== 'video') return;
  ph.textContent = '▶ 点此播放';
  ph.style.display = '';
  ph.style.cursor = 'pointer';
  ph.onclick = () => {
    ph.style.display = 'none'; ph.onclick = null;
    vdo.play().catch(() => { $('barState').textContent = '请再点一次播放'; tapToPlay('video'); });
  };
}

function next(auto) {
  if (!S.queue.length) return;
  if (S.idx + 1 < S.queue.length) load(S.idx + 1, auto !== false);
  else if (S.mode === 'loop') load(0, auto !== false);
  else { ado.pause(); vdo.pause(); $('barState').textContent = '列表播放完毕'; setBtn(false); }
}
function prev() { if (S.idx > 0) load(S.idx - 1, media().paused === false); else load(0, media().paused === false); }

function onEnded() {
  setBtn(false);
  if (S.mode === 'single') { const m = media(); m.currentTime = 0; m.play(); return; }
  const g = S.gap;
  if (g > 0) {
    $('barState').textContent = g + ' 秒后播放下一个…';
    stopGap();
    S.gapTimer = setTimeout(() => next(true), g * 1000);
  } else next(true);
}

[ado, vdo].forEach(m => {
  m.addEventListener('ended', () => { if (m === media()) onEnded(); });
  m.addEventListener('play', () => { if (m === media()) { setBtn(true); $('barState').textContent = '正在播放'; } });
  m.addEventListener('pause', () => { if (m === media()) setBtn(false); });
  m.addEventListener('loadedmetadata', () => {
    if (m === media()) { $('tDur').textContent = fmt(m.duration); }
  });
  m.addEventListener('timeupdate', () => {
    if (m !== media() || S.seeking) return;
    $('tCur').textContent = fmt(m.currentTime);
    if (m.duration) $('seek').value = Math.round(m.currentTime / m.duration * 1000);
    const it = S.queue[S.idx];
    if (it) save({ last: { k: it.k, t: m.currentTime } });
  });
  m.addEventListener('error', () => {
    if (m !== media()) return;
    $('barState').textContent = '加载失败，检查文件是否存在';
  });
});

function setBtn(p) { $('bPlay').textContent = p ? '❚❚' : '▶'; }

/* ---------- tab ---------- */
function switchTab(t, silent) {
  if (S.tab === t) return;
  ado.pause(); vdo.pause(); stopGap();
  S.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  renderList();
  if (!silent) {
    S.sel.clear(); updateSelBtn();
    $('vwrap').style.display = t === 'video' ? '' : 'none';
    $('vph').style.display = '';
    $('btnFull').style.display = t === 'video' ? '' : 'none';
    $('nowIc').textContent = t === 'audio' ? '🎧' : '🎬';
    if (!S.queue.length || S.queue[S.idx] && S.queue[S.idx].t !== t) {
      $('nowName').textContent = '尚未播放';
      $('nowSub').textContent = t === 'audio' ? '从左侧列表选择一个音频开始' : '从左侧列表选择一个视频开始';
      $('barName').textContent = '—';
    }
  }
}

/* ---------- 选择 ---------- */
function updateSelBtn() {
  const b = $('btnPlaySel');
  b.textContent = '▶ 播放选中（' + S.sel.size + '）';
  b.disabled = S.sel.size === 0;
}
function selectedQueue() {
  const all = flat(S.tab);
  return all.filter(it => S.sel.has(it.k));
}

/* ---------- 事件 ---------- */
$('list').addEventListener('click', e => {
  const cb = e.target.closest('[data-cb]');
  if (cb) {
    const k = decodeURIComponent(cb.dataset.cb);
    cb.checked ? S.sel.add(k) : S.sel.delete(k);
    updateSelBtn(); e.stopPropagation(); return;
  }
  const gb = e.target.closest('[data-g]');
  if (gb) {
    const gn = decodeURIComponent(gb.dataset.g);
    const g = flat(S.tab).filter(x => x.g === gn);
    if (g.length) setQueue(g, g[0].k);
    return;
  }
  const it = e.target.closest('.item');
  if (!it) return;
  const k = decodeURIComponent(it.dataset.k);
  const one = flat(S.tab).find(x => x.k === k);
  if (!one) return;
  const q = (S.sel.size && S.sel.has(k)) ? selectedQueue() : flat(S.tab);
  setQueue(q, k);
});
$('queue').addEventListener('click', e => {
  const j = e.target.closest('[data-jump]');
  if (j) { load(+j.dataset.jump, true); return; }
  const d = e.target.closest('[data-del]');
  if (d) {
    const i = +d.dataset.del, cur = S.idx;
    S.queue.splice(i, 1);
    if (S.queue.length === 0) { ado.pause(); vdo.pause(); S.idx = -1; }
    else if (i < cur) S.idx = cur - 1;
    else if (i === cur) { S.idx = Math.min(cur, S.queue.length - 1); load(S.idx, false); }
    renderQueue(); markPlaying();
  }
});
$('btnSelAll').onclick = () => { flat(S.tab).forEach(i => S.sel.add(i.k)); renderList(); updateSelBtn(); };
$('btnSelNone').onclick = () => { S.sel.clear(); renderList(); updateSelBtn(); };
$('btnPlaySel').onclick = () => { const q = selectedQueue(); if (q.length) setQueue(q, q[0].k); };
$('btnPlayAll').onclick = () => { const q = flat(S.tab); if (q.length) setQueue(q, q[0].k); };
$('btnQClear').onclick = () => { stopGap(); ado.pause(); vdo.pause(); S.queue = []; S.idx = -1; renderQueue(); markPlaying(); };
document.querySelectorAll('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));

$('bPlay').onclick = () => {
  if (!S.queue.length) { const q = flat(S.tab); if (q.length) setQueue(q, q[0].k); return; }
  const m = media();
  m.paused ? m.play().catch(() => {}) : m.pause();
};
$('bPrev').onclick = prev;
$('bNext').onclick = () => { stopGap(); next(true); };
$('bBack').onclick = () => { const m = media(); m.currentTime = Math.max(0, m.currentTime - 5); };
$('seek').addEventListener('input', e => {
  const m = media();
  if (m.duration) { S.seeking = true; $('tCur').textContent = fmt(m.duration * e.target.value / 1000); }
});
$('seek').addEventListener('change', e => {
  const m = media();
  if (m.duration) m.currentTime = m.duration * e.target.value / 1000;
  S.seeking = false;
});
$('vol').addEventListener('input', e => { ado.volume = vdo.volume = e.target.value; save({ vol: e.target.value }); });
$('rate').onchange = e => { ado.playbackRate = vdo.playbackRate = parseFloat(e.target.value); save({ rate: e.target.value }); };
$('gap').onchange = e => { S.gap = +e.target.value; save({ gap: e.target.value }); };
$('mode').onchange = e => setMode(e.target.value, true);
$('bMode').onclick = () => {
  const order = ['loop', 'order', 'single'];
  setMode(order[(order.indexOf(S.mode) + 1) % 3], true);
};
function setMode(m, persist) {
  S.mode = m; $('mode').value = m;
  $('bMode').textContent = { loop: '列表循环', order: '顺序播放', single: '单曲循环' }[m];
  if (persist) save({ mode: m });
}
$('btnFull').onclick = () => { vdo.requestFullscreen ? vdo.requestFullscreen() : vdo.webkitEnterFullscreen(); };

document.addEventListener('keydown', e => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const m = media();
  if (e.code === 'Space') { e.preventDefault(); $('bPlay').click(); }
  else if (e.key === 'ArrowLeft') { m.currentTime = Math.max(0, m.currentTime - 5); }
  else if (e.key === 'ArrowRight') { m.currentTime = Math.min(m.duration || 0, m.currentTime + 5); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); $('vol').value = Math.min(1, +$('vol').value + .05); $('vol').dispatchEvent(new Event('input')); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); $('vol').value = Math.max(0, +$('vol').value - .05); $('vol').dispatchEvent(new Event('input')); }
  else if (e.key === 'n' || e.key === 'N') { stopGap(); next(true); }
  else if (e.key === 'p' || e.key === 'P') prev();
});

/* ---------- 记忆 ---------- */
function save(o) {
  try {
    const d = JSON.parse(localStorage.getItem(LS) || '{}');
    localStorage.setItem(LS, JSON.stringify(Object.assign(d, o)));
  } catch (e) {}
}
function restore() {
  try {
    const d = JSON.parse(localStorage.getItem(LS) || '{}');
    if (d.vol != null) { $('vol').value = d.vol; ado.volume = vdo.volume = d.vol; }
    if (d.rate) { $('rate').value = d.rate; ado.playbackRate = vdo.playbackRate = parseFloat(d.rate); }
    if (d.gap != null) { $('gap').value = d.gap; S.gap = +d.gap; }
    if (d.mode) setMode(d.mode);
    return d.last || null;
  } catch (e) { return null; }
}

/* ---------- init ---------- */
/* iOS / iPadOS：系统音量才生效，网页端滑块无效，直接隐藏避免误导 */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS) { const v = document.querySelector('.vol'); if (v) v.style.display = 'none'; }

renderList(); renderQueue(); updateSelBtn(); setMode('loop');
const last = restore();
if (last && last.k) {
  const t = last.k.split('|')[0];
  const one = flat(t).find(x => x.k === last.k);
  if (one) {
    $('nowSub').textContent = '上次播放到：' + one.name + '（点击右侧"继续"回到该进度）';
    const b = document.createElement('button');
    b.className = 'btn sm'; b.textContent = '↻ 继续上次';
    b.onclick = () => {
      if (one.t !== S.tab) switchTab(one.t, true);
      setQueue(flat(one.t), one.k);
      const mm = media();
      if (last.t > 0) mm.addEventListener('loadedmetadata', function h() {
        mm.currentTime = last.t; mm.removeEventListener('loadedmetadata', h);
      });
      $('nowSub').textContent = (one.t === 'audio' ? '音频' : '视频') + ' · ' + one.g;
    };
    $('now').appendChild(b);
  }
}
</script>
</body>
